name: Recolectar datos

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar colector
        run: npm run collect

      - name: Commitear datos si cambiaron
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/latest.json public/data/history.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "chore: actualizar datos $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
